[project]
name = "kapibara"
version = "1.0.0"
description = "Kapibala full-stack task orchestration service (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "requests>=2.32",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL (set TEST_DATABASE_URL)",
]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
